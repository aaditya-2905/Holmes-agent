# HolmesGPT config for running directly on this machine (see local-sre/README.md).
# The model comes from $MODEL and the key from $OPENROUTER_API_KEY (or another provider's key env var).
# Paths are relative to the repo root; run.sh starts the server from there.

custom_toolsets:
  - local-sre/toolsets/local_machine.yaml

toolsets:
  # Kubernetes tools stay available for the clusters in ~/.kube/config.
  kubernetes/core:
    enabled: true
  kubernetes/logs:
    enabled: true
  kubernetes/live-metrics:
    enabled: true

  connectivity_check:
    enabled: true
  internet:
    enabled: true

  bash:
    enabled: true
    config:
      builtin_allowlist: "core"
      # Read-only commands auto-approved on top of the core list. Anything else
      # comes back as a pending approval in the /api/chat response.
      allow:
        - "ping -c"
        - "tracepath"
        - "mtr --report"
        - "dig"
        - "nslookup"
        - "host"
        # A prefix only sees the start of a command, so these entries are paired with
        # argument checks in holmes/plugins/toolsets/bash/command_arg_rules.py:
        # `ip` is limited to show/list/get, `journalctl` refuses --vacuum-*/--rotate/
        # --flush/..., and `dig` refuses -f/-k (which read local files).
        - "ip"
        - "ss -"
        - "resolvectl status"
        - "resolvectl query"
        # Only forms whose subcommand is fixed by the prefix. `nmcli connection show`
        # is left out: it accepts --show-secrets and would print saved Wi-Fi passwords.
        - "nmcli device status"
        - "nmcli -t device status"
        - "nmcli general status"
        - "systemctl status"
        - "systemctl --user status"
        - "systemctl list-units"
        - "systemctl --failed"
        - "systemctl is-active"
        - "systemctl show"
        - "journalctl"
        - "docker ps"
        - "docker logs"
        # `docker inspect` is not auto-approved: it prints a container's environment,
        # including the API key this stack passes to the agent container. Use the
        # local_docker_container_details tool, which leaves the environment out.
        - "docker stats --no-stream"
        - "ps"
        - "pgrep"
        - "free"
        - "df"
        - "uptime"
        - "vmstat"
        - "iostat"
        - "lsblk"
        - "nproc"
        - "lscpu"
      # No deny list: deny entries only match the first words of a command, so
      # `journalctl -u ssh --rotate` slipped past `journalctl --rotate`. The
      # argument checks in command_arg_rules.py cover those flags in any position.
